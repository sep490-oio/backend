name: Deploy Aspire to VPS via Docker Compose

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash
        working-directory: src/aspire/OIO.AppHost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          dotnet --info
          aspire --version
          docker version
          docker compose version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app images
        env:
          REGISTRY_ENDPOINT: ghcr.io
          REGISTRY_REPOSITORY: ${{ github.repository }}
          APP_VERSION: ${{ github.sha }}

          # Aspire Parameters for AppHost
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ vars.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_FAMILY_SLIDING_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_FAMILY_SLIDING_EXPIRATION }}
          JWT_REFRESH_TOKEN_FAMILY_ABSOLUTE_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_FAMILY_ABSOLUTE_EXPIRATION }}

          MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}

          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USE_START_TLS: ${{ vars.EMAIL_USE_START_TLS }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}

          DEFAULT_ACCOUNT_EMAIL: ${{ secrets.DEFAULT_ACCOUNT_EMAIL }}
          DEFAULT_ACCOUNT_USERNAME: ${{ secrets.DEFAULT_ACCOUNT_USERNAME }}
          DEFAULT_ACCOUNT_PASSWORD: ${{ secrets.DEFAULT_ACCOUNT_PASSWORD }}
          DEFAULT_ACCOUNT_FIRSTNAME: ${{ vars.DEFAULT_ACCOUNT_FIRSTNAME }}
          DEFAULT_ACCOUNT_LASTNAME: ${{ vars.DEFAULT_ACCOUNT_LASTNAME }}
          DEFAULT_ACCOUNT_DISPLAYNAME: ${{ vars.DEFAULT_ACCOUNT_DISPLAYNAME }}
        run: |
          aspire do push

      - name: Generate Docker Compose deployment assets
        env:
          REGISTRY_ENDPOINT: ghcr.io
          REGISTRY_REPOSITORY: ${{ github.repository }}
          APP_VERSION: ${{ github.sha }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ vars.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_FAMILY_SLIDING_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_FAMILY_SLIDING_EXPIRATION }}
          JWT_REFRESH_TOKEN_FAMILY_ABSOLUTE_EXPIRATION: ${{ vars.JWT_REFRESH_TOKEN_FAMILY_ABSOLUTE_EXPIRATION }}

          MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}

          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USE_START_TLS: ${{ vars.EMAIL_USE_START_TLS }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}

          DEFAULT_ACCOUNT_EMAIL: ${{ secrets.DEFAULT_ACCOUNT_EMAIL }}
          DEFAULT_ACCOUNT_USERNAME: ${{ secrets.DEFAULT_ACCOUNT_USERNAME }}
          DEFAULT_ACCOUNT_PASSWORD: ${{ secrets.DEFAULT_ACCOUNT_PASSWORD }}
          DEFAULT_ACCOUNT_FIRSTNAME: ${{ vars.DEFAULT_ACCOUNT_FIRSTNAME }}
          DEFAULT_ACCOUNT_LASTNAME: ${{ vars.DEFAULT_ACCOUNT_LASTNAME }}
          DEFAULT_ACCOUNT_DISPLAYNAME: ${{ vars.DEFAULT_ACCOUNT_DISPLAYNAME }}
          
        run: |
          rm -rf aspire-output deploy-bundle
          aspire do prepare-compose --environment production

          mkdir -p deploy-bundle

          COMPOSE_FILE=$(find aspire-output -type f \( -name 'docker-compose.yaml' -o -name 'docker-compose.yml' \) | head -n 1)
          ENV_FILE=$(find aspire-output -type f \( -name '.env' -o -name '.env.*' \) | head -n 1)

          if [ -z "$COMPOSE_FILE" ]; then
            echo "docker-compose file not found under aspire-output"
            exit 1
          fi

          if [ -z "$ENV_FILE" ]; then
            echo ".env file not found under aspire-output"
            exit 1
          fi

          cp "$COMPOSE_FILE" deploy-bundle/docker-compose.yaml
          cp "$ENV_FILE" deploy-bundle/.env

          echo "Generated files:"
          ls -la deploy-bundle
          echo "Compose source: $COMPOSE_FILE"
          echo "Env source: $ENV_FILE"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: aspire-compose-bundle
          include-hidden-files: true
          path: src/aspire/OIO.AppHost/deploy-bundle

  deploy-to-vps:
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-package

    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: aspire-compose-bundle
          include-hidden-files: true
          path: deploy-bundle

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload compose bundle to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -T -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/myapp"
          scp -P "${VPS_PORT:-22}" deploy-bundle/docker-compose.yaml "$VPS_USER@$VPS_HOST:/opt/myapp/docker-compose.yaml"
          scp -P "${VPS_PORT:-22}" deploy-bundle/.env.Production "$VPS_USER@$VPS_HOST:/opt/myapp/.env.Production"
          sleep 3

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

          # Chỉ cần nếu GHCR image là private
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -T -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "export GHCR_PULL_USERNAME='${GHCR_PULL_USERNAME}'; export GHCR_PULL_TOKEN='${GHCR_PULL_TOKEN}'; bash -se" <<'EOF'
            set -euo pipefail
            cd /opt/myapp
            if [ -n "${GHCR_PULL_USERNAME:-}" ] && [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin
            fi
            docker compose -f docker-compose.yaml --env-file .env.Production pull
            docker compose -f docker-compose.yaml --env-file .env.Production up -d --remove-orphans
            docker image prune -af --filter "until=168h" || true
          EOF
